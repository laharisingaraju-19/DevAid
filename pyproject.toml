[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DevAid"
version = "0.1.0"
description = "An agentic AI coding assistant powered by Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "python-dotenv"
]

[tool.setuptools.packages.find]
where = ["src"]